name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check repository structure
      run: |
        echo "Checking repository structure..."
        if [ ! -f README.md ]; then
          echo "ERROR: README.md is missing"
          exit 1
        fi
        if [ ! -f LICENSE ]; then
          echo "ERROR: LICENSE is missing"
          exit 1
        fi
        echo "Repository structure is valid"

    - name: Verify README content
      run: |
        echo "Verifying README.md contains project information..."
        if grep -q "Pol-IPd" README.md; then
          echo "README.md contains project name"
        else
          echo "ERROR: README.md missing project name"
          exit 1
        fi
        echo "README verification passed"

